name: CGV Odyssey IMAX monitor

on:
  schedule:
    - cron: '2/5 * 17-23 9 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'once: CGV 조회 / test-discord: 알림 테스트 / run: 상태 저장'
        required: true
        default: once
        type: choice
        options:
          - once
          - test-discord
          - run
      notify_existing:
        description: '최초 run에서 기존 회차 한 번 알림'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cgv-odyssey-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.CGV_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      MODE: ${{ inputs.mode }}
      NOTIFY_EXISTING: ${{ inputs.notify_existing }}
    steps:
      - uses: actions/checkout@v4
      - name: Check schedule and send alerts
        shell: bash
        run: |
          case "$MODE" in
            once) option=--once ;;
            test-discord) option=--test-discord ;;
            run|'') option=--run ;;
            *) echo 'Invalid mode'; exit 2 ;;
          esac
          extra=()
          if [[ "$option" == '--run' && "$NOTIFY_EXISTING" == 'true' ]]; then
            extra+=(--notify-existing)
          fi
          set +e
          python3 monitor.py "$option" "${extra[@]}"
          result=$?
          set -e
          if [[ "$option" == '--run' && -f state.json ]]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update CGV monitor state'
              git push
            fi
          fi
          exit "$result"
