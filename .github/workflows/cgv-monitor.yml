name: CGV IMAX monitor (legacy manual only)

on:
  # Scheduled monitoring moved to Cloudflare. Do not run both engines together.
  workflow_dispatch:
    inputs:
      mode:
        description: 'once: CGV 조회 / test-alert: 실제 회차 알림 테스트 / test-discord: 연결 테스트 / run: 감시'
        required: true
        default: once
        type: choice
        options:
          - once
          - test-discord
          - test-alert
          - run
      notify_existing:
        description: '최초 run에서 기존 회차 한 번 알림'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cgv-odyssey-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Explicit rollback opt-in. This variable is absent by default.
    if: vars.CGV_LEGACY_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      MODE: ${{ inputs.mode }}
      NOTIFY_EXISTING: ${{ inputs.notify_existing }}
    steps:
      - uses: actions/checkout@v4
      - name: Check schedule and send alerts
        shell: bash
        run: |
          case "$MODE" in
            once) option=--once ;;
            test-discord) option=--test-discord ;;
            test-alert) option=--test-alert ;;
            run|'') option=--run ;;
            *) echo 'Invalid mode'; exit 2 ;;
          esac
          extra=()
          if [[ "$option" == '--run' && "$NOTIFY_EXISTING" == 'true' ]]; then
            extra+=(--notify-existing)
          fi
          if [[ "$option" != '--run' ]]; then
            python3 monitor.py "$option"
            exit $?
          fi

          persist_state() {
            if [[ ! -f state.json ]]; then
              return
            fi
            git add state.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update CGV monitor state'
              git push
            fi
          }

          started=$(date +%s)
          for attempt in 1 2 3 4 5; do
            printf '[%s KST] CGV 조회 시작 (%s/5)\n' "$(TZ=Asia/Seoul date +%H:%M:%S)" "$attempt"
            set +e
            python3 monitor.py --run "${extra[@]}"
            result=$?
            set -e
            persist_state
            if [[ "$result" -ne 0 ]]; then
              echo 'CGV 조회 실패: 이번 workflow의 추가 요청을 중단합니다.'
              exit "$result"
            fi
            if python3 -c 'import json,sys; sys.exit(0 if json.load(open("state.json", encoding="utf-8")).get("next_retry") else 1)'; then
              echo 'CGV 조회 대기 중: 이번 workflow의 추가 요청을 중단합니다.'
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              break
            fi
            elapsed=$(( $(date +%s) - started ))
            if (( elapsed + 60 >= 260 )); then
              echo '다음 예약 실행과 겹치지 않도록 반복 조회를 마칩니다.'
              break
            fi
            sleep 60
          done
