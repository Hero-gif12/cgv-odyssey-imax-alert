name: Tests
on:
  push:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/worker.test.mjs
